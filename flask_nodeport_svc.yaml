apiVersion: v1
kind: Service
metadata:
  name: planet-svc-np
  namespace: test
spec:
  type: NodePort
  selector:
    run: planet
  ports:
  - name: http
    protocol: TCP
    port: 5001
    targetPort: 5000
    nodePort: 31000

---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-svc-np
  namespace: test
spec:
  type: NodePort
  selector:
    run: dashboard
  ports:
  - name: http
    protocol: TCP
    port: 6001
    targetPort: 6000
    nodePort: 32000

